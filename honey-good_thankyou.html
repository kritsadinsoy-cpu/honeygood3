<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอบคุณสำหรับคำสั่งซื้อ — Honey good</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo">Honey <span>good</span></a>
    </div>
  </header>

  <main style="min-height: calc(100vh - 160px); display: flex; align-items: center;">
    <div class="container" style="max-width: 580px; text-align: center; padding-top: 4rem; padding-bottom: 4rem;">
      <div style="background-color: var(--bg-card); border: 1px solid var(--border-light); padding: 3.5rem 2.5rem;">
        <span class="section-subtitle">Thank You</span>
        <h1 style="font-size: 2rem; margin-bottom: 1.25rem;">ได้รับคำสั่งซื้อเรียบร้อยแล้ว</h1>
        <div style="width: 36px; height: 1px; background-color: var(--accent-gold); margin: 0 auto 1.5rem auto;"></div>
        <p style="margin-bottom: 2.5rem;">
          ขอขอบคุณที่ไว้วางใจเลือกความหวานบริสุทธิ์จาก <strong>Honey good</strong><br>
          ทางเราบันทึกข้อมูลเรียบร้อยแล้ว และจะรีบดำเนินการจัดเตรียมพัสดุให้คุณอย่างดีที่สุด
        </p>
        <a href="index.html" class="btn">กลับหน้าแรก</a>
      </div>
    </div>
  </main>

  <footer style="border-top: 1px solid var(--border-light); padding: 3rem 0; text-align: center;">
    <div class="container">
      <p style="font-size: 0.85rem; color: var(--text-muted);">© 2026 Honey good. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
