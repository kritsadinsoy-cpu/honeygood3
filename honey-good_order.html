<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า — Honey good</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo">Honey <span>good</span></a>
      <nav style="display: flex; gap: 2rem; align-items: center;">
        <a href="index.html" style="text-decoration: none; color: var(--text-secondary); font-size: 0.85rem; letter-spacing: 0.1em;">หน้าแรก</a>
        <a href="product.html" style="text-decoration: none; color: var(--text-secondary); font-size: 0.85rem; letter-spacing: 0.1em;">สินค้าทั้งหมด</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width: 640px;">
      <div class="section-header" style="margin-bottom: 3rem;">
        <span class="section-subtitle">Order Details</span>
        <h1>ยืนยันรายการสั่งซื้อ</h1>
        <p style="margin-top: 0.75rem;">กรุณากรอกข้อมูลสำหรับการจัดส่งให้ครบถ้วน</p>
      </div>

      <form id="orderForm" style="background-color: var(--bg-card); border: 1px solid var(--border-light); padding: 2.75rem;">
        <div class="form-group">
          <label for="customerName" class="form-label">ชื่อ-นามสกุล ลูกค้า *</label>
          <input type="text" id="customerName" class="form-control" placeholder="ระบุชื่อผู้รับสินค้า" required>
        </div>

        <div class="form-group">
          <label for="contact" class="form-label">เบอร์โทร / Line ID *</label>
          <input type="text" id="contact" class="form-control" placeholder="เช่น 081-234-5678 หรือ @lineid" required>
        </div>

        <div class="form-group">
          <label for="items" class="form-label">รายการสินค้า *</label>
          <input type="text" id="items" class="form-control" placeholder="ชื่อรายการสินค้า" required>
        </div>

        <div class="form-group">
          <label for="total" class="form-label">จำนวนเงินรวม (บาท) *</label>
          <input type="number" id="total" class="form-control" placeholder="0" required>
        </div>

        <div class="form-group" style="margin-bottom: 2.25rem;">
          <label for="note" class="form-label">ที่อยู่จัดส่ง / หมายเหตุเพิ่มเติม</label>
          <textarea id="note" rows="3" class="form-control" placeholder="ระบุที่อยู่สำหรับจัดส่งพัสดุ หรือข้อความถึงร้านค้า"></textarea>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; text-align: center;">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <footer style="border-top: 1px solid var(--border-light); padding: 3rem 0; text-align: center;">
    <div class="container">
      <p style="font-size: 0.85rem; color: var(--text-muted);">© 2026 Honey good. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
