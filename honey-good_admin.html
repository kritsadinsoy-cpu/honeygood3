<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายการคำสั่งซื้อ (Admin) — Honey good</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
    }
    #ordersTable {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    #ordersTable th,
    #ordersTable td {
      padding: 1.15rem 1.25rem;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }
    #ordersTable th {
      background-color: var(--bg-secondary);
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    #ordersTable tbody tr:hover {
      background-color: var(--bg-primary);
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo">Honey <span>good</span></a>
      <nav style="display: flex; gap: 2rem; align-items: center;">
        <a href="index.html" style="text-decoration: none; color: var(--text-secondary); font-size: 0.85rem; letter-spacing: 0.1em;">หน้าแรก</a>
        <a href="product.html" style="text-decoration: none; color: var(--text-secondary); font-size: 0.85rem; letter-spacing: 0.1em;">สินค้าทั้งหมด</a>
        <a href="admin.html" style="text-decoration: none; color: var(--text-primary); font-size: 0.85rem; letter-spacing: 0.1em;">ผู้ดูแลระบบ</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-header" style="margin-bottom: 3rem;">
        <span class="section-subtitle">Fulfillment &amp; Orders</span>
        <h1>รายการคำสั่งซื้อทั้งหมด</h1>
        <p style="margin-top: 0.75rem;">ข้อมูลคำสั่งซื้อล่าสุดสำหรับตรวจสอบและจัดเตรียมพัสดุ</p>
      </div>

      <div class="table-wrap">
        <table id="ordersTable">
          <thead>
            <tr>
              <th>วันเวลา</th>
              <th>ชื่อลูกค้า</th>
              <th>เบอร์โทร/Line</th>
              <th>รายการสินค้า</th>
              <th>จำนวนเงินรวม</th>
              <th>หมายเหตุ</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer style="border-top: 1px solid var(--border-light); padding: 3rem 0; text-align: center;">
    <div class="container">
      <p style="font-size: 0.85rem; color: var(--text-muted);">© 2026 Honey good. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
